<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Anh Yêu Em ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
            transition: all 0.5s ease;
            overflow: hidden;
            position: relative;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-hearts span {
            position: absolute;
            display: block;
            font-size: 24px;
            animation: floatHeart 12s infinite linear;
            opacity: 0.3;
        }
        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(233, 30, 99, 0.2);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: fadeInUp 1s ease;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ec407a, #f06292);
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 52px;
            box-shadow: 0 10px 40px rgba(233, 30, 99, 0.3);
            transition: all 0.5s;
            animation: pulseAvatar 2s infinite ease-in-out;
        }
        @keyframes pulseAvatar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 15px 60px rgba(233, 30, 99, 0.4); }
        }

        .name-title {
            font-family: 'Great Vibes', cursive;
            font-size: 40px;
            color: #c2185b;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .sub-text {
            color: #ad1457;
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .love-message {
            background: rgba(248, 187, 208, 0.25);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 22px;
            border: 1px solid rgba(233, 30, 99, 0.1);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #880e4f;
            line-height: 1.8;
            font-weight: 400;
            font-style: italic;
        }
        .love-message .heart-icon {
            color: #e91e63;
            margin: 0 6px;
        }

        .btn-love {
            background: linear-gradient(135deg, #ec407a, #c2185b);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 40px rgba(233, 30, 99, 0.3);
            width: 100%;
            letter-spacing: 2px;
        }
        .btn-love:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 60px rgba(233, 30, 99, 0.4);
        }
        .btn-love:active {
            transform: scale(0.97);
        }

        .love-note {
            margin-top: 18px;
            font-size: 13px;
            color: #ad1457;
            opacity: 0.6;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .love-counter {
            margin-top: 12px;
            font-size: 12px;
            color: #c2185b;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* Hiệu ứng bắn tim khi click */
        .heart-burst {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 999;
            animation: burstHeart 1.2s ease-out forwards;
            user-select: none;
        }
        @keyframes burstHeart {
            0% { transform: scale(0.2); opacity: 0; }
            30% { opacity: 1; transform: scale(1.4); }
            100% { opacity: 0; transform: scale(0.5) translate(var(--tx), var(--ty)); }
        }

        .sparkle {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            z-index: 999;
            animation: sparkleFly 2s ease-in-out forwards;
            user-select: none;
        }
        @keyframes sparkleFly {
            0% { transform: translate(0,0) scale(0); opacity: 0; }
            30% { opacity: 1; transform: translate(20px,-60px) scale(1.2); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(80px,-180px) scale(0.6); }
        }
    </style>
</head>
<body>

<div class="floating-hearts" id="floatingHearts"></div>

<div class="container" id="mainContainer">
    <div class="avatar" id="avatar">❤️</div>
    <div class="name-title" id="nameTitle">Anh Yêu Em</div>
    <p class="sub-text" id="subText">✨ Gửi đến người anh thương ✨</p>

    <div class="love-message" id="loveMessage">
        <span>Anh yêu em ❤️ từ lúc yêu em</span>
    </div>

    <button class="btn-love" id="btnLove" onclick="showLove()">💕 Ấn vào đây để nhận yêu thương 💕</button>

    <p class="love-note" id="loveNote">❤️ 1,234,567 người đã nhận được tình yêu ❤️</p>
    <p class="love-counter" id="loveCounter">✨ Cảm ơn em đã xuất hiện ✨</p>
</div>

<script>
    // ===== THÔNG ĐIỆP TÌNH YÊU =====
    const loveMessages = [
        "Anh yêu em ❤️ từ lúc yêu em",
        "Em là ánh sáng của đời anh ✨",
        "Mỗi ngày anh đều nhớ em 💕",
        "Trái tim anh chỉ dành cho em 💖",
        "Anh yêu em ❤️ nhiều hơn cả bầu trời",
        "Em là điều tuyệt vời nhất của anh 💗",
        "Anh yêu em từ lúc yêu em ❤️",
        "Đời anh có em là đủ 💘",
        "Anh yêu em ❤️ em có biết không?",
        "Mãi mãi yêu em 💕",
        "Em là người anh yêu nhất ❤️",
        "Anh yêu em ❤️ từ lúc yêu em"
    ];

    // ===== TẠO TRÁI TIM BAY NỀN =====
    function createFloatingHearts() {
        const container = document.getElementById('floatingHearts');
        const hearts = ['❤️', '💕', '💗', '💖', '💘', '💝', '✨', '🌸'];
        for (let i = 0; i < 30; i++) {
            const span = document.createElement('span');
            span.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            span.style.left = Math.random() * 100 + '%';
            span.style.animationDuration = (10 + Math.random() * 15) + 's';
            span.style.animationDelay = (Math.random() * 12) + 's';
            span.style.fontSize = (14 + Math.random() * 30) + 'px';
            container.appendChild(span);
        }
    }
    createFloatingHearts();

    // ===== HIỆU ỨNG BẮN TIM =====
    function createHeartBurst() {
        const hearts = ['❤️', '💕', '💗', '💖', '💘', '💝', '✨'];
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < 20; i++) {
            const el = document.createElement('div');
            el.className = 'heart-burst';
            el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            const angle = (i / 20) * Math.PI * 2 + Math.random() * 0.2;
            const dist = 100 + Math.random() * 180;
            el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            el.style.setProperty('--ty', Math.sin(angle) * dist - 80 + 'px');
            el.style.left = (centerX - 20 + Math.random() * 40) + 'px';
            el.style.top = (centerY - 20 + Math.random() * 40) + 'px';
            el.style.fontSize = (20 + Math.random() * 35) + 'px';
            el.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }
    }

    function createSparkles() {
        const sparkles = ['✨', '💫', '🌟', '⭐'];
        for (let i = 0; i < 12; i++) {
            const el = document.createElement('div');
            el.className = 'sparkle';
            el.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
            el.style.left = (Math.random() * 80 + 10) + '%';
            el.style.top = (Math.random() * 80 + 10) + '%';
            el.style.fontSize = (18 + Math.random() * 25) + 'px';
            el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }
    }

    // ===== HÀM HIỂN THỊ TÌNH YÊU =====
    function showLove() {
        const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
        document.getElementById('loveMessage').innerHTML = `<span>${msg}</span>`;
        document.getElementById('avatar').style.animation = 'none';
        document.getElementById('avatar').style.transform = 'scale(0.8)';
        setTimeout(() => {
            document.getElementById('avatar').style.transform = 'scale(1)';
            document.getElementById('avatar').style.animation = 'pulseAvatar 2s infinite ease-in-out';
        }, 100);

        // Bắn tim
        createHeartBurst();
        setTimeout(createHeartBurst, 300);
        setTimeout(createSparkles, 200);
        setTimeout(createSparkles, 500);

        // Đổi màu nhẹ
        const colors = [
            'linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1)',
            'linear-gradient(135deg, #f3e5f5, #e1bee7, #ce93d8)',
            'linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7)',
            'linear-gradient(135deg, #fff3e0, #ffcc80, #ffab91)'
        ];
        document.body.style.background = colors[Math.floor(Math.random() * colors.length)];

        // Thêm tin nhắn
        try { navigator.clipboard.writeText(msg); } catch(e) {}
    }

    // ===== TỰ ĐỘNG HIỆN TÌNH YÊU MỖI 10 GIÂY =====
    let autoLoveInterval = setInterval(() => {
        showLove();
    }, 12000);

    // ===== HOVER VÀO AVATAR CŨNG BẮN TIM =====
    document.getElementById('avatar').addEventListener('mouseenter', () => {
        createHeartBurst();
        createSparkles();
    });

    // ===== TẠO HIỆU ỨNG KHI LOAD =====
    setTimeout(showLove, 1000);
    setTimeout(createHeartBurst, 1500);
    setTimeout(createSparkles, 2000);
</script>
</body>
</html>
