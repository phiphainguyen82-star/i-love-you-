<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ I Love You ❤️</title>
<style>
body { background: linear-gradient(135deg, #ff6b6b, #c0392b); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Arial; }
.container { background: white; padding: 40px; border-radius: 30px; text-align: center; max-width: 400px; }
.heart { font-size: 80px; display: block; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
h1 { color: #c0392b; }
.btn { background: #c0392b; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; cursor: pointer; }
#surprise { display: none; margin-top: 20px; padding: 20px; background: #1a1a2e; border-radius: 15px; color: #ff4444; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
<span class="heart">❤️</span>
<h1>I Love You ❤️</h1>
<button class="btn" onclick="chui()">💝 Nhấn vào đây 💝</button>
<div id="surprise"></div>
</div>
<script>
const insults = ["Ðcm mày! yêu boooo honggg? títttt xấuuu!", "Mày bị lừa rồi con ạ!", "I love you cái lồn!", "Rảnh quá hả? Vào đây nghe chửi!", "Đồ ngu!", "Mày tin tình yêu à? Mơ đi!", "Tao cười mày đấy!", "Mày vừa bị troll! Chúc mừng!", "Tình yêu của mày chỉ có trong mơ thôi!"];
function chui() {
const insult = insults[Math.floor(Math.random() * insults.length)];
document.getElementById('surprise').innerHTML = '🔥 ' + insult + ' 🔥';
document.getElementById('surprise').style.display = 'block';
document.body.style.background = 'linear-gradient(135deg, #1a1a2e, #16213e)';
document.querySelector('.container').style.background = '#2d2d2d';
document.querySelector('h1').style.color = '#ff4444';
document.querySelector('h1').textContent = '🔥 MÀY BỊ LỪA RỒI! 🔥';
document.querySelector('.heart').textContent = '💀';
document.querySelector('.btn').style.display = 'none';
try { navigator.clipboard.writeText(insult); } catch(e) {}
}
</script>
</body>
</html>
